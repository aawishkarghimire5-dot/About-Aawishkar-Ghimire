<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>About Aawishkar Ghimire | Calculator</title>



    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #111d35,
                    #070b14 60%
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;
        }


        /* =========================
           CALCULATOR
        ========================= */

        .calculator {

            width: 370px;

            max-width: 100%;

            padding: 25px;

            background: #0e1524;

            border:
                1px solid #263247;

            border-radius: 24px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.4);
        }


        /* =========================
           HEADER
        ========================= */

        .calculator-header {

            text-align: center;

            margin-bottom: 20px;
        }


        .calculator-header h1 {

            font-size: 25px;

            margin-bottom: 7px;
        }


        .calculator-header h1 span {

            color: #00d9ff;
        }


        .calculator-header p {

            color: #758196;

            font-size: 13px;
        }


        /* =========================
           DISPLAY
        ========================= */

        .display-container {

            position: relative;

            margin-bottom: 18px;
        }


        #display {

            width: 100%;

            height: 85px;

            border: none;

            outline: none;

            border-radius: 14px;

            background: #070b14;

            color: white;

            font-size: 32px;

            text-align: right;

            padding: 15px 18px;

            box-shadow:
                inset 0 0 0 1px
                #182235;
        }


        #display.error {

            color: #ff6b7a;
        }


        /* =========================
           BUTTON GRID
        ========================= */

        .buttons {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }


        button {

            height: 62px;

            border: none;

            border-radius: 13px;

            background: #182235;

            color: white;

            font-size: 19px;

            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.2s,
                box-shadow 0.2s;
        }


        button:hover {

            background: #263653;

            transform: translateY(-2px);
        }


        button:active {

            transform:
                translateY(1px)
                scale(0.97);
        }


        /* =========================
           OPERATORS
        ========================= */

        .operator {

            color: #00d9ff;

            background: #111f31;
        }


        .operator:hover {

            background: #17334a;
        }


        /* =========================
           CLEAR
        ========================= */

        .clear {

            background: #351a23;

            color: #ff7181;
        }


        .clear:hover {

            background: #4a202c;
        }


        /* =========================
           DELETE
        ========================= */

        .delete {

            background: #241b3a;

            color: #b09cff;
        }


        .delete:hover {

            background: #30234d;
        }


        /* =========================
           EQUAL
        ========================= */

        .equal {

            background:
                linear-gradient(
                    135deg,
                    #6c63ff,
                    #00d9ff
                );

            grid-row: span 2;

            height: 134px;

            font-size: 26px;
        }


        .equal:hover {

            background:
                linear-gradient(
                    135deg,
                    #766eff,
                    #19defc
                );

            box-shadow:
                0 10px 25px
                rgba(0, 217, 255, 0.15);
        }


        /* =========================
           ZERO
        ========================= */

        .zero {

            grid-column: span 2;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-link {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 20px;

            color: #8f9bad;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }


        .back-link:hover {

            color: #00d9ff;
        }


        /* =========================
           CREDIT
        ========================= */

        .credit {

            margin-top: 12px;

            text-align: center;

            color: #4f5c70;

            font-size: 11px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 420px) {

            .calculator {

                padding: 18px;

                border-radius: 20px;
            }


            button {

                height: 58px;

                font-size: 18px;
            }


            .equal {

                height: 126px;
            }


            #display {

                height: 75px;

                font-size: 27px;
            }

        }

    </style>

</head>



<body>


<div class="calculator">


    <!-- =====================
         HEADER
    ====================== -->

    <div class="calculator-header">

        <h1>

            Aawishkar
            <span>
                Calculator
            </span>

        </h1>


        <p>

            Simple JavaScript Calculator

        </p>

    </div>



    <!-- =====================
         DISPLAY
    ====================== -->

    <div class="display-container">

        <input
            type="text"
            id="display"
            value="0"
            readonly
            aria-label="Calculator display">

    </div>



    <!-- =====================
         BUTTONS
    ====================== -->

    <div class="buttons">


        <!-- ROW 1 -->

        <button
            class="clear"
            onclick="clearDisplay()">

            AC

        </button>


        <button
            class="delete"
            onclick="deleteLast()">

            DEL

        </button>


        <button
            class="operator"
            onclick="addOperator('%')">

            %

        </button>


        <button
            class="operator"
            onclick="addOperator('/')">

            ÷

        </button>



        <!-- ROW 2 -->

        <button
            onclick="addNumber('7')">

            7

        </button>


        <button
            onclick="addNumber('8')">

            8

        </button>


        <button
            onclick="addNumber('9')">

            9

        </button>


        <button
            class="operator"
            onclick="addOperator('*')">

            ×

        </button>



        <!-- ROW 3 -->

        <button
            onclick="addNumber('4')">

            4

        </button>


        <button
            onclick="addNumber('5')">

            5

        </button>


        <button
            onclick="addNumber('6')">

            6

        </button>


        <button
            class="operator"
            onclick="addOperator('-')">

            −

        </button>



        <!-- ROW 4 -->

        <button
            onclick="addNumber('1')">

            1

        </button>


        <button
            onclick="addNumber('2')">

            2

        </button>


        <button
            onclick="addNumber('3')">

            3

        </button>


        <button
            class="operator"
            onclick="addOperator('+')">

            +

        </button>



        <!-- ROW 5 -->

        <button
            class="zero"
            onclick="addNumber('0')">

            0

        </button>


        <button
            onclick="addNumber('.')">

            .

        </button>


        <button
            class="equal"
            onclick="calculate()">

            =

        </button>


    </div>



    <!-- =====================
         BACK TO PROJECTS
    ====================== -->

    <a
        href="./projects.html"
        class="back-link">

        ← Back to Projects

    </a>


    <div class="credit">

        Built by Aawishkar Ghimire

    </div>


</div>



<script>

    /* =========================
       GET DISPLAY
    ========================= */

    const display =
        document.getElementById("display");



    /* =========================
       ADD NUMBER
    ========================= */

    function addNumber(number) {

        if (display.value === "Error") {

            display.value = "0";

            display.classList.remove("error");

        }


        if (number === ".") {

            let parts =
                display.value.split(
                    /[+\-*/%]/
                );

            let currentNumber =
                parts[parts.length - 1];


            if (currentNumber.includes(".")) {

                return;

            }

        }


        if (display.value === "0") {

            if (number === ".") {

                display.value = "0.";

            } else {

                display.value = number;

            }

        } else {

            display.value += number;

        }

    }



    /* =========================
       ADD OPERATOR
    ========================= */

    function addOperator(operator) {

        if (display.value === "Error") {

            return;

        }


        let lastCharacter =
            display.value.slice(-1);


        const operators =
            ["+", "-", "*", "/", "%"];


        if (operators.includes(lastCharacter)) {

            return;

        }


        display.value += operator;

    }



    /* =========================
       CLEAR
    ========================= */

    function clearDisplay() {

        display.value = "0";

        display.classList.remove("error");

    }



    /* =========================
       DELETE LAST
    ========================= */

    function deleteLast() {

        if (display.value === "Error") {

            clearDisplay();

            return;

        }


        if (display.value.length <= 1) {

            display.value = "0";

            return;

        }


        display.value =
            display.value.slice(0, -1);

    }



    /* =========================
       CALCULATE
    ========================= */

    function calculate() {

        if (display.value === "Error") {

            return;

        }


        try {

            let expression =
                display.value;


            let lastCharacter =
                expression.slice(-1);


            const operators =
                ["+", "-", "*", "/", "%"];


            if (
                operators.includes(
                    lastCharacter
                )
            ) {

                expression =
                    expression.slice(0, -1);

            }


            /*
             * Function is used only after
             * calculator buttons generate
             * the expression.
             */

            let result =
                Function(
                    '"use strict"; return (' +
                    expression +
                    ')'
                )();


            if (
                typeof result !== "number" ||
                !Number.isFinite(result)
            ) {

                throw new Error("Invalid");

            }


            /*
             * Avoid extremely long
             * decimal results.
             */

            result =
                Number(
                    result.toFixed(10)
                );


            display.value = result;

        }

        catch (error) {

            display.value = "Error";

            display.classList.add("error");

        }

    }



    /* =========================
       KEYBOARD SUPPORT
    ========================= */

    document.addEventListener(
        "keydown",
        function(event) {

            const key = event.key;


            if (
                key >= "0" &&
                key <= "9"
            ) {

                addNumber(key);

            }


            else if (
                key === "+" ||
                key === "-" ||
                key === "*" ||
                key === "/" ||
                key === "%"
            ) {

                addOperator(key);

            }


            else if (key === ".") {

                addNumber(".");

            }


            else if (key === "Enter" ||
                     key === "=") {

                calculate();

            }


            else if (key === "Backspace") {

                deleteLast();

            }


            else if (key === "Escape") {

                clearDisplay();

            }

        }
    );

</script>


</body>

</html>
